<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Workspace Client</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        sidebar {
            width: 300px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            padding: 10px;
            font-size: 0.9rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            padding: 15px 25px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            font-size: 1rem;
            font-weight: 500;
        }

        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background-color: var(--accent-color);
            color: white;
            align-self: flex-end;
        }

        .message.bot {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }

        .chat-input-area {
            padding: 20px 25px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .chat-input-area textarea {
            resize: none;
            height: 45px;
        }

        .chat-input-area button {
            width: 100px;
            height: 45px;
        }

        .status-banner {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error-color);
            color: #fca5a5;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <sidebar>
        <div class="brand">
            <span>⚙️ Workspace Config</span>
        </div>

        <div id="statusBanner" class="status-banner"></div>

        <div class="form-group">
            <label for="inputApiKey">Gemini API Key</label>
            <input type="password" id="inputApiKey" placeholder="AIzaSy...">
        </div>

        <div class="form-group">
            <label for="inputModel">Execution Model</label>
            <select id="inputModel">
                <option value="gemini-3.8-flash">gemini-3.8-flash (Latest Flash)</option>
                <option value="gemini-3.1-pro">gemini-3.1-pro (Deep Reasoning)</option>
                <option value="gemini-2.5-flash">gemini-2.5-flash (Standard Production)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="inputPrompt">System Instructions</label>
            <textarea id="inputPrompt" rows="4">You are an expert technical assistant. Keep responses clear and accurately formatted in Markdown.</textarea>
        </div>

        <button id="saveConfigBtn" style="margin-top: auto;">Save & Apply</button>
    </sidebar>

    <main>
        <div class="chat-header" id="headerTitle">Gemini Workspace</div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">Hello! Configure your API key on the left to start querying the Gemini runtime.</div>
        </div>

        <div class="chat-input-area">
            <textarea id="userMessage" placeholder="Type your instruction or query here..."></textarea>
            <button id="sendBtn">Send</button>
        </div>
    </main>

    <script>
        let botConfig = {
            apiKey: localStorage.getItem('ws_api_key') || "",
            model: localStorage.getItem('ws_model') || "gemini-3.8-flash",
            systemPrompt: localStorage.getItem('ws_prompt') || "You are an expert technical assistant."
        };

        document.getElementById('inputApiKey').value = botConfig.apiKey;
        document.getElementById('inputModel').value = botConfig.model;
        document.getElementById('inputPrompt').value = botConfig.systemPrompt;

        document.getElementById('saveConfigBtn').addEventListener('click', () => {
            botConfig.apiKey = document.getElementById('inputApiKey').value.trim();
            botConfig.model = document.getElementById('inputModel').value;
            botConfig.systemPrompt = document.getElementById('inputPrompt').value.trim();

            localStorage.setItem('ws_api_key', botConfig.apiKey);
            localStorage.setItem('ws_model', botConfig.model);
            localStorage.setItem('ws_prompt', botConfig.systemPrompt);

            showStatus("Configuration saved successfully!", false);
        });

        function showStatus(msg, isError) {
            const banner = document.getElementById('statusBanner');
            banner.style.display = 'block';
            banner.style.background = isError ? 'rgba(239, 68, 68, 0.1)' : 'rgba(59, 130, 246, 0.1)';
            banner.style.borderColor = isError ? 'var(--error-color)' : 'var(--accent-color)';
            banner.style.color = isError ? '#fca5a5' : '#93c5fd';
            banner.textContent = msg;
            setTimeout(() => { banner.style.display = 'none'; }, 4000);
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('userMessage').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const textInput = document.getElementById('userMessage');
            const text = textInput.value.trim();
            if (!text) return;

            if (!botConfig.apiKey) {
                showStatus("Please enter and save a valid Gemini API Key first.", true);
                return;
            }

            appendMessage(text, 'user');
            textInput.value = '';

            const chatContainer = document.getElementById('chatMessages');
            const loadingId = 'loading-' + Date.now();
            appendMessage("Thinking...", 'bot', loadingId);

            // Active REST endpoint schema for generateContent
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${botConfig.model}:generateContent`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-goog-api-key': botConfig.apiKey
                    },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: `${botConfig.systemPrompt}\n\nUser Request: ${text}` }] }
                        ]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.error) {
                    appendMessage(`API Error (${data.error.code}): ${data.error.message}`, 'bot');
                } else if (data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessage(reply, 'bot');
                } else {
                    appendMessage("Received unexpected response payload: " + JSON.stringify(data), 'bot');
                }
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                appendMessage(`Connection Blocked: ${err.message}. (Ensure you are serving this file via a local development server or extension if direct browser security blocks requests).`, 'bot');
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(text, sender, customId = null) {
            const chatContainer = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            if (customId) msgDiv.id = customId;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
