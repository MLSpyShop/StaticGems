<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Mobile Interactions Client</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #1e293b;
            --card-bg: #111827;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        header h1 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 6px;
        }

        .settings-drawer {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 16px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out;
        }

        .settings-drawer.open {
            max-height: 380px;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select, textarea {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            padding: 10px 12px;
            font-size: 16px; 
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .btn-primary:active {
            background: var(--accent-hover);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 0.95rem;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background-color: var(--accent-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .attachment-preview {
            font-size: 0.75rem;
            background: rgba(0,0,0,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .chat-input-area {
            padding: 10px 16px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .chat-input-area textarea {
            resize: none;
            height: 44px;
            max-height: 120px;
            line-height: 1.3;
            flex: 1;
        }

        .icon-action-btn {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .chat-input-area button.send-btn {
            width: 60px;
            height: 44px;
            flex-shrink: 0;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .status-banner {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error-color);
            color: #fca5a5;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: none;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Gemini Multimodal</h1>
        <button class="icon-btn" id="toggleSettings" aria-label="Settings">⚙️</button>
    </header>

    <div class="settings-drawer" id="settingsDrawer">
        <div id="statusBanner" class="status-banner"></div>
        <div class="form-group">
            <label for="inputApiKey">API Key</label>
            <input type="password" id="inputApiKey" placeholder="AIzaSy...">
        </div>
        <div class="form-group">
            <label for="inputModel">Model</label>
            <select id="inputModel">
                <option value="gemini-3.8-flash">gemini-3.8-flash (Latest Intelligence)</option>
                <option value="gemini-3.7-flash">gemini-3.7-flash (Latest Workhorse)</option>
                <option value="gemini-2.5-pro">gemini-2.5-pro (Deep Reasoning)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="inputPrompt">System Instructions</label>
            <textarea id="inputPrompt" rows="2">You are a concise, helpful mobile assistant.</textarea>
        </div>
        <button class="btn-primary" id="saveConfigBtn">Save Configuration</button>
    </div>

    <main>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">Interactions API client ready. Type a message or attach a file below.</div>
        </div>

        <div class="chat-input-area">
            <div id="filePreviewContainer"></div>
            <div class="input-row">
                <input type="file" id="fileInput">
                <button class="icon-action-btn" id="attachBtn" title="Attach File">📎</button>
                <textarea id="userMessage" placeholder="Message Gemini..."></textarea>
                <button class="send-btn" id="sendBtn">Send</button>
            </div>
        </div>
    </main>

    <script>
        let botConfig = {
            apiKey: localStorage.getItem('ia_api_key') || "",
            model: localStorage.getItem('ia_model') || "gemini-3.8-flash",
            systemPrompt: localStorage.getItem('ia_prompt') || "You are a concise, helpful mobile assistant."
        };

        let attachedFile = null;

        document.getElementById('inputApiKey').value = botConfig.apiKey;
        document.getElementById('inputModel').value = botConfig.model;
        document.getElementById('inputPrompt').value = botConfig.systemPrompt;

        const drawer = document.getElementById('settingsDrawer');
        document.getElementById('toggleSettings').addEventListener('click', () => {
            drawer.classList.toggle('open');
        });

        document.getElementById('saveConfigBtn').addEventListener('click', () => {
            botConfig.apiKey = document.getElementById('inputApiKey').value.trim();
            botConfig.model = document.getElementById('inputModel').value;
            botConfig.systemPrompt = document.getElementById('inputPrompt').value.trim();

            localStorage.setItem('ia_api_key', botConfig.apiKey);
            localStorage.setItem('ia_model', botConfig.model);
            localStorage.setItem('ia_prompt', botConfig.systemPrompt);

            showStatus("Saved successfully!", false);
            drawer.classList.remove('open');
        });

        function showStatus(msg, isError) {
            const banner = document.getElementById('statusBanner');
            banner.style.display = 'block';
            banner.textContent = msg;
            setTimeout(() => { banner.style.display = 'none'; }, 3000);
        }

        // File attachment handling
        const fileInput = document.getElementById('fileInput');
        document.getElementById('attachBtn').addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                attachedFile = {
                    name: file.name,
                    mimeType: file.type || 'application/octet-stream',
                    data: uploadEvent.target.result.split(',')[1] // Extract base64 part
                };

                const previewContainer = document.getElementById('filePreviewContainer');
                previewContainer.innerHTML = `<div class="attachment-preview">📎 Attached: ${file.name} <span style="cursor:pointer; margin-left:6px;" onclick="removeAttachment()">❌</span></div>`;
            };
            reader.readAsDataURL(file);
        });

        window.removeAttachment = function() {
            attachedFile = null;
            fileInput.value = '';
            document.getElementById('filePreviewContainer').innerHTML = '';
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('userMessage').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        async function sendMessage() {
            const textInput = document.getElementById('userMessage');
            const text = textInput.value.trim();
            if (!text && !attachedFile) return;

            if (!botConfig.apiKey) {
                drawer.classList.add('open');
                showStatus("Please enter your API Key first.", true);
                return;
            }

            let displayMsg = text;
            if (attachedFile) displayMsg += `\n[Attached File: ${attachedFile.name}]`;

            appendMessage(displayMsg, 'user');
            textInput.value = '';

            const currentFile = attachedFile;
            removeAttachment(); // Clear attachment state

            const chatContainer = document.getElementById('chatMessages');
            const loadingId = 'loading-' + Date.now();
            appendMessage("Thinking...", 'bot', loadingId);

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/interactions`;

            // Build payload for Interactions API supporting inline input parts or file attachments
            let requestBody = {
                model: botConfig.model,
                input: `${botConfig.systemPrompt}\n\nUser: ${text}`
            };

            if (currentFile) {
                requestBody.input = [
                    {
                        text: `${botConfig.systemPrompt}\n\nUser: ${text}`
                    },
                    {
                        inline_data: {
                            mime_type: currentFile.mimeType,
                            data: currentFile.data
                        }
                    }
                ];
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-goog-api-key': botConfig.apiKey
                    },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.error) {
                    appendMessage(`Error (${data.error.code}): ${data.error.message}`, 'bot');
                } else {
                    let outputText = "";

                    if (data.steps && Array.isArray(data.steps)) {
                        for (const step of data.steps) {
                            if (step.type === "model_output" && step.content && Array.isArray(step.content)) {
                                for (const part of step.content) {
                                    if (part.text) {
                                        outputText += part.text;
                                    }
                                }
                            }
                        }
                    }

                    if (!outputText && data.output_text) {
                        outputText = data.output_text;
                    }

                    if (outputText) {
                        appendMessage(outputText, 'bot');
                    } else {
                        appendMessage("Received response structure without text content.", 'bot');
                    }
                }
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                appendMessage(`Connection error: ${err.message}`, 'bot');
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(text, sender, customId = null) {
            const chatContainer = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            if (customId) msgDiv.id = customId;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
